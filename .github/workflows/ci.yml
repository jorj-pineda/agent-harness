name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Tests (offline)
        run: uv run pytest -m "not live"

      - name: Ruff
        run: uv run ruff check .

      - name: Python formatting
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Offline coding eval matrix
        run: >-
          uv run python -m evals.run --providers ollama,anthropic,openai
          --check --report reports/coding-contract.md

      - name: Retain coding contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-contract-report
          path: reports/coding-contract.md
          retention-days: 14
          if-no-files-found: warn

  support-regression:
    name: Support scenarios (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Offline support eval matrix
        run: >-
          uv run python -m evals.run
          --scenarios evals/scenarios_support.yaml
          --providers ollama,anthropic,openai
          --check --report reports/support-contract.md

      - name: Retain support contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-contract-report
          path: reports/support-contract.md
          retention-days: 14
          if-no-files-found: warn
