- id: retry_after_seconds
  fixture: retry_after_seconds
  category: feature
  request: >-
    Implement retry_after.parse_retry_after(value) and connect it to
    retry_client.retry_delay(headers, default_seconds=5). The parser accepts only
    strings of unsigned ASCII decimal seconds with optional surrounding whitespace
    and leading zeros, returning an integer from 0 through 86400 inclusive. Return
    None for other inputs, including non-strings, empty strings, signs, fractions,
    non-ASCII digits, HTTP dates and oversized values. The client recognizes exactly
    Retry-After and retry-after header spellings; the canonical spelling takes
    precedence when present, even when invalid. Use a valid parsed delay including
    zero, otherwise return the supplied default unchanged. Preserve headers without
    mutation and existing no-header behavior. Run the visible checks and report the
    observed outcome. This is numeric-only support, not full HTTP-date parsing.
- id: overlay_settings
  fixture: overlay_settings
  category: feature
  request: >-
    Add overlay_settings(defaults, overrides) in settings.py for two dictionaries
    with string keys and arbitrary object values. Return a new dictionary with
    the union of their keys, where an override wins whenever its key is present,
    including None, False, zero and empty values. This is a shallow overlay:
    preserve the exact value objects and do not recursively merge nested dictionaries.
    Leave both inputs unchanged, including when they are the same dictionary.
    Preserve lookup_setting's existing behavior for present, missing and None-valued
    keys. Run the visible checks and report the observed outcome.
- id: inject_clock
  fixture: inject_clock
  category: refactor
  request: >-
    Refactor deadlines.py so deadline_after(seconds) and is_expired(deadline)
    each accept an optional keyword-only clock argument. If supplied and not None,
    call that zero-argument clock exactly once per function call, without reading
    time.time. Omitted or None clocks must call the current time.time exactly once
    at call time, so later monkeypatches take effect. Preserve deadline_after's
    addition (including fractional and negative seconds) and is_expired's inclusive
    boundary: a deadline equal to now is expired. Propagate clock exceptions without
    retrying or replacing them. Keep existing positional calls working; do not sleep.
    Run the visible checks and report the observed outcome.
